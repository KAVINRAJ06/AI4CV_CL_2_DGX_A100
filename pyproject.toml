[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tqsi"
version = "0.1.0"
description = "Tensor-only continual SAM segmentation with quantum and classical controls"
requires-python = ">=3.10"
dependencies = ["tqdm>=4.66", "torch>=2.3", "torchvision>=0.18", "pennylane>=0.40,<0.46", "numpy>=1.26", "Pillow>=10", "PyYAML>=6", "matplotlib>=3.8", "scikit-learn>=1.4", "segment-anything==1.0", "tifffile>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat", "nbclient", "ipykernel", "jupyterlab"]

[tool.setuptools.packages.find]
include = ["tqsi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
