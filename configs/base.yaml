seed: 42
split_seed: 42
device: auto
cpu_threads: 4
output_dir: outputs/full
dataset_root: D:/AI4CV_CL_DGX_A100/A100_datasets
tasks:
  - configs/datasets/landcover_buildings.yaml
  - configs/datasets/openearthmap_buildings.yaml
image_size: 512
epochs: 24
batch_size: 2
workers: 0
lr: 0.0001
bottleneck_lr: 0.0001
weight_decay: 0.0
grad_clip: 1.0
lambda_sep: 0.1
lambda_stab: 0.1
loss:
  positive_weight: auto
  max_positive_weight: 20
  focal_gamma: 1.5
  overlap_weight: 1.0
  tversky_false_positive_weight: 0.3
  tversky_false_negative_weight: 0.7
train_sampling:
  enabled: true
  target_foreground_fraction: 0.5
  min_foreground_pixels: 32
  candidate_pool_size: 2048
fail_on_foreground_collapse: false
foreground_collapse_patience: 1
reference_samples: 8
tsne_samples_per_task: 128
selection_metric: iou
audit_overlay_count: 4
replay:
  samples_per_task: 0
  batch_size: 0
  weight: 1.0
model:
  backbone: sam
  sam_checkpoint: D:/AI4CV_CL_DGX_A100/models/sam_vit_b_01ec64.pth
  sam_variant: vit_b
  bottleneck_type: quantum
  n_qubits: 8
  n_layers: 6
  mask_strategy: qubit
  hidden_dim: 96
  num_classes: 1
  # This is the trainable decoder projection head: frozen encoder features
  # retain spatial layout while the quantum readout provides global context.
  decoder_spatial_adapter: true
  # Accuracy path: train a semantic segmentation head on spatial SAM features.
  # sam_prompt is retained only as the frozen-decoder TQSI ablation.
  decoder_mode: spatial_fpn
  decoder_width: 192
  decoder_dropout: 0.1
  decoder_image_refiner: true
  # Low-rank trainable residual adapter over frozen SAM feature maps.
  adapter_rank: 16
