# Use only after the single-task baseline reaches the agreed validation target.
extends: dgx_sota_single_task.yaml
output_dir: outputs/dgx_sota_continual
tasks:
  - configs/datasets/landcover_buildings.yaml
  - configs/datasets/openearthmap_buildings.yaml
# Label rehearsal protects segmentation quality; functional distillation keeps
# stored pixel logits stable while later tasks train the shared decoder.
replay: {samples_per_task: 256, batch_size: 8, weight: 1.0, distill_weight: 0.25}
reference_samples: 32
tsne_samples_per_task: 512
