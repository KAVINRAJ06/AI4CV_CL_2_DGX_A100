extends: local_smoke.yaml
output_dir: outputs/local_sam_smoke
image_size: 256
batch_size: 1
reference_samples: 1
epochs: 3
lr: 0.0005
max_samples: {train: 8, val: 8, test: 8}
replay: {samples_per_task: 2, batch_size: 1, weight: 1.0}
fail_on_foreground_collapse: true
foreground_collapse_patience: 3
train_sampling:
  enabled: true
  target_foreground_fraction: 0.5
  min_foreground_pixels: 32
  candidate_pool_size: 128
  foreground_crop_size: 256
model:
  backbone: sam
  n_qubits: 8
  n_layers: 6
