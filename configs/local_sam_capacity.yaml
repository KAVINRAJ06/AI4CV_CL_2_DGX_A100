# Fit exactly eight foreground-balanced source tiles before any benchmark claim.
extends: local_sam_spatial_head_smoke.yaml
output_dir: outputs/local_sam_capacity
epochs: 80
max_samples: {train: 8, val: 8, test: 8}
diagnostic_evaluation_split: train
capacity_test: {min_train_dice: 0.95}
train_sampling:
  enabled: true
  target_foreground_fraction: 0.75
  min_foreground_pixels: 32
  candidate_pool_size: 128
  foreground_crop_size: 256
